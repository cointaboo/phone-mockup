<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --bg:#0b0e14; --panel:#111721; --panel2:#0e141d; --line:#1e2733;
    --txt:#dbe3ee; --dim:#8b96a5; --acc:#3b82f6;
  }
  *{box-sizing:border-box}
  body{margin:0;width:352px;background:var(--bg);color:var(--txt);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
  .hd{display:flex;align-items:center;justify-content:space-between;
    padding:11px 13px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .hd b{font-size:13.5px}
  .sw{position:relative;width:40px;height:22px;border-radius:999px;background:#2a3546;
    cursor:pointer;transition:.16s;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;
    border-radius:50%;background:#fff;transition:.16s}
  .sw.on{background:var(--acc)}
  .sw.on::after{transform:translateX(18px)}
  .body{padding:11px 13px;max-height:520px;overflow-y:auto}
  .devices{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
  .devices button{font-size:11.5px;padding:7px 2px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .row label{color:var(--dim);font-size:12px;white-space:nowrap}
  input[type=text],select{width:140px;background:#080c12;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:5px 7px;font-size:12px;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--acc)}
  input[type=range]{width:132px;accent-color:var(--acc)}
  .val{width:40px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
  .sec{font-size:11px;color:#5f6b7c;text-transform:uppercase;letter-spacing:.6px;
    margin:12px 0 7px;padding-top:9px;border-top:1px solid var(--line)}
  .btns{display:flex;gap:7px;margin-top:12px}
  button{flex:1;cursor:pointer;border:1px solid var(--line);background:#18202c;color:var(--txt);
    padding:9px 8px;border-radius:7px;font-size:12.5px}
  button:hover{background:#1e2836}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.green{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.45);color:#4ade80}
  .ft{padding:8px 13px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;
    display:flex;justify-content:space-between}
  .tip{margin-top:9px;color:var(--dim);font-size:11px;line-height:1.5}
</style>
</head>
<body>
  <div class="hd">
    <b>手机截图模拟器</b>
    <div class="sw on" id="enabled"></div>
  </div>

  <div class="body">
    <div class="devices">
      <button data-preset="ip15">iPhone 15</button>
      <button data-preset="ip14">iPhone 14</button>
      <button data-preset="ipse">iPhone SE</button>
      <button data-preset="s24">三星 S24</button>
      <button data-preset="mi14">小米 14</button>
      <button data-preset="plain">通用</button>
    </div>

    <div class="row"><label>时间</label><input type="text" id="time" placeholder="留空=实时" maxlength="5"></div>
    <div class="row"><label>运营商</label><input type="text" id="carrier" placeholder="中国移动" maxlength="12"></div>
    <div class="row"><label>网络</label>
      <select id="net">
        <option value="5G">5G</option>
        <option value="4G">4G</option>
        <option value="LTE">LTE</option>
        <option value="隐藏">隐藏</option>
      </select>
    </div>
    <div class="row"><label>信号格</label><input type="range" id="signal" min="0" max="4" step="1" value="4"><span class="val" id="signalV">4</span></div>
    <div class="row"><label>电量</label><input type="range" id="battery" min="0" max="100" step="1" value="78"><span class="val" id="batteryV">78%</span></div>
    <div class="row"><label>显示百分比</label><div class="sw on" id="showPct" style="width:36px;height:20px"></div></div>
    <div class="row"><label>WiFi 图标</label><div class="sw on" id="wifi" style="width:36px;height:20px"></div></div>
    <div class="row"><label>充电状态</label><div class="sw" id="charging" style="width:36px;height:20px"></div></div>

    <div class="sec">外观</div>
    <div class="row"><label>状态栏系统</label>
      <select id="platform">
        <option value="ios">iOS（54pt，图标精细）</option>
        <option value="android">Android（24dp，图标略大）</option>
      </select>
    </div>
    <div class="row"><label>屏幕顶部</label>
      <select id="style">
        <option value="island">灵动岛</option>
        <option value="notch">刘海</option>
        <option value="punch">挖孔</option>
        <option value="none">无</option>
      </select>
    </div>
    <div class="row"><label>底部导航</label>
      <select id="nav">
        <option value="ios">iOS 横条</option>
        <option value="android">安卓三键</option>
      </select>
    </div>
    <div class="row"><label>状态栏文字</label>
      <select id="theme">
        <option value="light">白色（深色页）</option>
        <option value="dark">黑色（浅色页）</option>
      </select>
    </div>
    <div class="row"><label>渐变底</label><div class="sw on" id="barBg" style="width:36px;height:20px"></div></div>
    <div class="row"><label>圆角遮罩</label><div class="sw on" id="frame" style="width:36px;height:20px"></div></div>
    <div class="row"><label>外围压暗</label><div class="sw on" id="dim" style="width:36px;height:20px"></div></div>

    <div class="sec">截图</div>
    <div class="row"><label>加圆角+阴影</label><div class="sw on" id="beautify" style="width:36px;height:20px"></div></div>

    <div class="btns">
      <button class="primary" id="apply">应用</button>
      <button class="green" id="shot">截图</button>
    </div>
    <div class="tip">截图会连同手机外壳一起保存。浏览器内部页（chrome://）不支持。</div>
  </div>

  <div class="ft"><span id="status">就绪</span><span>v2.0.0</span></div>

<script src="popup.js"></script>
</body>
</html>
